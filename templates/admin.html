<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель сотрудника — PhotoKiosk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; color: #1a252f; }
        .nav-btn {
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ЗАГРУЗКА ФАЙЛОВ */
        .upload-area {
            border: 2px dashed #007bff;
            background: #f8fafd;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area input { display: none; }

        /* СПИСОК ФОТО ГАЛЕРЕИ */
        .admin-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .admin-photo-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #222;
        }
        .admin-photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(220, 53, 69, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
            line-height: 24px;
            padding: 0;
            text-align: center;
        }

        /* СПИСОК ЗАКАЗОВ */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .order-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            background: #fafbfc;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .order-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }
        .status-new { background: #ffeba2; color: #856404; }
        .status-process { background: #b8daff; color: #004085; }
        .status-done { background: #c3e6cb; color: #155724; }

        .order-items {
            margin: 10px 0;
            padding-left: 0;
            list-style: none;
        }
        .order-item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .order-item-row img {
            width: 50px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-process { background: #17a2b8; color: white; }
        .btn-done { background: #28a745; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛠️ Панель управления сотрудника</h1>
        <a href="/" class="nav-btn" target="_blank">🖥️ Открыть экран киоска</a>
    </div>

    <div class="main-grid">
        <!-- ЛЕВАЯ КОЛОНКА: ЗАКАЗЫ -->
        <div class="panel-box">
            <div class="panel-title">
                <span>📦 Поступившие заказы</span>
                <button class="btn-action" onclick="loadOrders()">🔄 Обновить</button>
            </div>
            <div class="orders-list" id="orders-list">
                <p style="color: #777;">Загрузка заказов...</p>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: УПРАВЛЕНИЕ ФОТОГРАФИЯМИ -->
        <div class="panel-box">
            <div class="panel-title">📸 Управление фотографиями</div>
            
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 28px; margin-bottom: 5px;">📤</div>
                <strong>Нажмите для загрузки фото</strong>
                <div style="font-size: 12px; color: #777; margin-top: 4px;">PNG, JPG, WEBP</div>
                <input type="file" id="file-input" multiple accept="image/*" onchange="uploadFiles(this.files)">
            </div>

            <div class="admin-gallery" id="admin-gallery">
                <!-- Галерея фото -->
            </div>
        </div>
    </div>

    <script>
        async function loadAdminPhotos() {
            try {
                const res = await fetch('/api/photos');
                const photos = await res.json();
                const container = document.getElementById('admin-gallery');
                container.innerHTML = '';

                photos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'admin-photo-card';
                    card.innerHTML = `
                        <img src="${photo.url || photo.path}">
                        <button class="btn-delete" onclick="deletePhoto('${photo.id}')" title="Удалить фото">×</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error('Ошибка загрузки фото:', e);
            }
        }

        async function uploadFiles(files) {
            if (!files.length) return;
            const formData = new FormData();
            for (let f of files) formData.append('files', f);

            try {
                await fetch('/api/upload', { method: 'POST', body: formData });
                loadAdminPhotos();
            } catch (e) {
                alert('Ошибка загрузки');
            }
        }

        async function deletePhoto(photoId) {
            if (!confirm('Удалить эту фотографию из киоска?')) return;
            try {
                await fetch(`/api/photos/${photoId}`, { method: 'DELETE' });
                loadAdminPhotos();
            } catch (e) {
                alert('Ошибка удаления');
            }
        }

        async function loadOrders() {
            const list = document.getElementById('orders-list');
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    list.innerHTML = '<p style="color: #777;">Заказов пока нет</p>';
                    return;
                }

                list.innerHTML = '';
                orders.forEach(ord => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    
                    let statusClass = 'status-new';
                    if (ord.status === 'process') statusClass = 'status-process';
                    if (ord.status === 'done') statusClass = 'status-done';

                    card.innerHTML = `
                        <div class="order-header">
                            <span>Заказ № ${ord.id} (${ord.time})</span>
                            <span class="order-status ${statusClass}">${ord.statusText}</span>
                        </div>
                        <div class="order-items">
                            ${ord.items.map(item => `
                                <div class="order-item-row">
                                    <img src="${item.photoUrl}">
                                    <div>${item.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <strong>Сумма: ${ord.total} ₽</strong>
                            <div class="order-actions">
                                <button class="btn-action btn-process" onclick="changeStatus('${ord.id}', 'process')">В печать</button>
                                <button class="btn-action btn-done" onclick="changeStatus('${ord.id}', 'done')">Готов / Выдан</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                console.error('Ошибка загрузки заказов:', e);
                list.innerHTML = '<p style="color: red;">Ошибка при загрузке заказов</p>';
            }
        }

        async function changeStatus(orderId, newStatus) {
            try {
                await fetch(`/api/orders/${orderId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                loadOrders();
            } catch (e) {
                alert('Не удалось обновить статус заказа');
            }
        }

        loadAdminPhotos();
        loadOrders();
        setInterval(loadOrders, 5000);
        setInterval(loadAdminPhotos, 10000);
    </script>
</body>
</html>
