<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотокиоск — Выбор Фото</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
        }
        .photo-card:hover {
            transform: scale(1.02);
        }
        .photo-card.selected {
            border-color: #007bff;
        }
        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .photo-name {
            padding: 10px;
            font-size: 14px;
            color: #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checkmark {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007bff;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 28px;
            font-weight: bold;
        }
        .photo-card.selected .checkmark {
            display: block;
        }
        #loading {
            font-size: 18px;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>📷 Выберите нужные фотографии</h1>
    <p class="subtitle">Нажмите на фото, чтобы отметить его</p>

    <div id="loading">Загрузка галереи...</div>
    <div class="gallery" id="gallery"></div>

    <script>
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const photos = await response.json();
                
                const gallery = document.getElementById('gallery');
                const loading = document.getElementById('loading');
                
                gallery.innerHTML = '';
                
                if (photos.length === 0) {
                    loading.innerText = 'В папке пока нет доступных фотографий.';
                    return;
                }
                
                loading.style.display = 'none';
                
                photos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.onclick = () => card.classList.toggle('selected');
                    
                    const imgUrl = photo.url || photo.path || `/static/uploads/${photo.filename}`;
                    
                    card.innerHTML = `
                        <div class="checkmark">✓</div>
                        <img src="${imgUrl}" alt="${photo.name || photo.filename}" loading="lazy">
                        <div class="photo-name">${photo.name || photo.filename}</div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка загрузки галереи:', error);
                document.getElementById('loading').innerText = 'Ошибка при загрузке фотографий.';
            }
        }

        // Загружаем фото при открытии страницы
        loadPhotos();
        
        // Автообновление галереи каждые 10 секунд
        setInterval(loadPhotos, 10000);
    </script>
</body>
</html>
