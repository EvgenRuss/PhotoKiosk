<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотокиоск — Выбор Фото</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #333; margin-top: 10px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
        }
        .photo-card:hover { transform: scale(1.02); }
        .photo-card.selected { border-color: #007bff; }
        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .photo-name {
            padding: 10px;
            font-size: 14px;
            color: #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checkmark {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007bff;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 28px;
            font-weight: bold;
        }
        .photo-card.selected .checkmark { display: block; }
        #loading { font-size: 18px; color: #777; margin-top: 40px; }

        /* СПЯЩИЙ РЕЖИМ (СЛАЙД-ШОУ) */
        #screensaver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050508;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            cursor: pointer;
            overflow: hidden;
        }
        
        /* Картинка слайд-шоу с плавным размытием/проявлением */
        .slideshow-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 8s ease;
            transform: scale(1);
        }
        .slideshow-img.active {
            opacity: 1;
            transform: scale(1.05); /* Легкий эффект приближения */
        }

        /* Темный градиент снизу для текста */
        .screensaver-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            color: white;
            z-index: 2;
            pointer-events: none;
        }
        .screensaver-text {
            font-size: 32px;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }
        .screensaver-subtext {
            font-size: 18px;
            opacity: 0.85;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Экран спящего режима (Слайд-шоу) -->
    <div id="screensaver" onclick="wakeUp(event)">
        <img id="slide1" class="slideshow-img" alt="Slide 1">
        <img id="slide2" class="slideshow-img" alt="Slide 2">
        
        <div class="screensaver-overlay">
            <div class="screensaver-text">📸 Нажмите на экран, чтобы начать</div>
            <div class="screensaver-subtext">Коснитесь любой области для выбора фотографий</div>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <h1>📷 Выберите нужные фотографии</h1>
    <p class="subtitle">Нажмите на фото, чтобы отметить его</p>

    <div id="loading">Загрузка галереи...</div>
    <div class="gallery" id="gallery"></div>

    <script>
        let currentPhotos = [];

        // 1. ЗАГРУЗКА ГАЛЕРЕИ
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                currentPhotos = await response.json();
                
                const gallery = document.getElementById('gallery');
                const loading = document.getElementById('loading');
                
                if (currentPhotos.length === 0) {
                    gallery.innerHTML = '';
                    loading.innerText = 'В папке пока нет доступных фотографий.';
                    loading.style.display = 'block';
                    return;
                }
                
                loading.style.display = 'none';
                
                const selectedIds = Array.from(document.querySelectorAll('.photo-card.selected')).map(c => c.dataset.id);
                
                gallery.innerHTML = '';
                
                currentPhotos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.dataset.id = photo.id;
                    if (selectedIds.includes(photo.id)) {
                        card.classList.add('selected');
                    }
                    
                    card.onclick = (e) => {
                        e.stopPropagation();
                        card.classList.toggle('selected');
                        resetIdleTimer();
                    };
                    
                    const imgUrl = photo.url || photo.path || `/static/uploads/${photo.filename}`;
                    
                    card.innerHTML = `
                        <div class="checkmark">✓</div>
                        <img src="${imgUrl}" alt="${photo.name || photo.filename}" loading="lazy">
                        <div class="photo-name">${photo.name || photo.filename}</div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка загрузки галереи:', error);
            }
        }

        loadPhotos();
        setInterval(loadPhotos, 10000);

        // 2. СЛАЙД-ШОУ В СПЯЩЕМ РЕЖИМЕ
        let slideIndex = 0;
        let slideshowInterval = null;
        let activeSlideToggle = true;

        function nextSlide() {
            if (!currentPhotos || currentPhotos.length === 0) return;

            const slide1 = document.getElementById('slide1');
            const slide2 = document.getElementById('slide2');
            
            const nextPhoto = currentPhotos[slideIndex % currentPhotos.length];
            const nextUrl = nextPhoto.url || nextPhoto.path;

            // Поочередно меняем слои картинки для кросс-фейд (плавного) перехода
            if (activeSlideToggle) {
                slide2.src = nextUrl;
                slide2.classList.add('active');
                slide1.classList.remove('active');
            } else {
                slide1.src = nextUrl;
                slide1.classList.add('active');
                slide2.classList.remove('active');
            }

            activeSlideToggle = !activeSlideToggle;
            slideIndex++;
        }

        function startSlideshow() {
            if (currentPhotos.length > 0) {
                slideIndex = 0;
                nextSlide();
                // Смена фото каждые 4 секунды (4000 миллисекунд)
                slideshowInterval = setInterval(nextSlide, 4000);
            }
        }

        function stopSlideshow() {
            if (slideshowInterval) {
                clearInterval(slideshowInterval);
                slideshowInterval = null;
            }
        }

        // 3. ЛОГИКА ТАЙМЕРА (15 СЕКУНД)
        let idleTimer = null;
        const screensaver = document.getElementById('screensaver');

        function startSleep() {
            // Снимаем выделения с выбранных фото при уходе в сон
            document.querySelectorAll('.photo-card.selected').forEach(c => c.classList.remove('selected'));
            screensaver.style.display = 'flex';
            startSlideshow();
        }

        function wakeUp(e) {
            if (e) e.stopPropagation();
            screensaver.style.display = 'none';
            stopSlideshow();
            resetIdleTimer();
        }

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(startSleep, 15000);
        }

        document.addEventListener('click', resetIdleTimer);
        document.addEventListener('touchstart', resetIdleTimer);

        resetIdleTimer();
    </script>
</body>
</html>
